<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="A content audit in five steps"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7691"/></marker></defs><rect width="1280" height="720" rx="24" fill="#FFFFFF"/><rect x="1" y="1" width="1278" height="718" rx="24" fill="none" stroke="#D5E1EC" stroke-width="2"/><text x="64" y="84" font-family="Sora,Arial,sans-serif" font-size="34" font-weight="700" fill="#0A2540">A content audit in five steps</text><rect x="64" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="165" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">1. List</text><text x="165" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">every page</text><text x="165" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">on your site</text><line x1="270" y1="305" x2="298" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="302" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="403" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">2. Add data</text><text x="403" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">traffic, links,</text><text x="403" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">age, quality</text><line x1="507" y1="305" x2="535" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="539" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="640" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">3. Decide</text><text x="640" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">keep, update,</text><text x="640" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">merge or remove</text><line x1="745" y1="305" x2="773" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="777" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="878" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">4. Act</text><text x="878" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">improve and</text><text x="878" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">redirect</text><line x1="982" y1="305" x2="1010" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="1014" y="230" width="202" height="150" rx="16" fill="#BDF0EA" stroke="#19C3B5" stroke-width="2"/><text x="1115" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">5. Recheck</text><text x="1115" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">measure after</text><text x="1115" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">4 to 8 weeks</text><rect x="64" y="470" width="1152" height="120" rx="16" fill="#FFF6DB" stroke="#E0A100" stroke-width="2"/><text x="640" y="538" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#0A2540" text-anchor="middle">Start with the pages that matter most. Do not delete anything that has links or traffic.</text></svg>