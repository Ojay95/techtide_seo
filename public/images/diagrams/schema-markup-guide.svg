<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="How schema markup works"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7691"/></marker></defs><rect width="1280" height="720" rx="24" fill="#FFFFFF"/><rect x="1" y="1" width="1278" height="718" rx="24" fill="none" stroke="#D5E1EC" stroke-width="2"/><text x="64" y="84" font-family="Sora,Arial,sans-serif" font-size="34" font-weight="700" fill="#0A2540">How schema markup works</text><rect x="64" y="230" width="230" height="140" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="179.0" y="294" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">Your page</text><text x="179.0" y="322" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">visible content</text><line x1="300" y1="300" x2="372" y2="300" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="378" y="230" width="230" height="140" rx="16" fill="#BDF0EA" stroke="#19C3B5" stroke-width="2"/><text x="493.0" y="294" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">Structured data</text><text x="493.0" y="322" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">JSON-LD in the page</text><line x1="614" y1="300" x2="686" y2="300" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="692" y="230" width="230" height="140" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="807.0" y="294" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">Search engine</text><text x="807.0" y="322" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">reads and understands</text><line x1="928" y1="300" x2="1000" y2="300" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="1006" y="230" width="210" height="140" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="1111.0" y="294" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">Search result</text><text x="1111.0" y="322" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">may show extras</text><rect x="250" y="470" width="185" height="64" rx="16" fill="#FFFFFF" stroke="#19C3B5" stroke-width="2"/><text x="342.5" y="509" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Organization</text><rect x="455" y="470" width="185" height="64" rx="16" fill="#FFFFFF" stroke="#19C3B5" stroke-width="2"/><text x="547.5" y="509" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Service</text><rect x="660" y="470" width="185" height="64" rx="16" fill="#FFFFFF" stroke="#19C3B5" stroke-width="2"/><text x="752.5" y="509" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Article</text><rect x="865" y="470" width="185" height="64" rx="16" fill="#FFFFFF" stroke="#19C3B5" stroke-width="2"/><text x="957.5" y="509" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Breadcrumb</text><text x="640" y="430" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#3F5266" text-anchor="middle">Common types</text><text x="640" y="640" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#5B7691" text-anchor="middle">The markup must match what visitors can see on the page.</text></svg>