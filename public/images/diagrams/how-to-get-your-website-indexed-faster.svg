" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">3. Evaluated</text><text x="640" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">quality and</text><text x="640" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">duplicates checked</text><line x1="745" y1="305" x2="773" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="777" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="878" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">4. Indexed</text><text x="878" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">page stored</text><text x="878" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">in the index</text><line x1="982" y1="305" x2="1010" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="1014" y="230" width="202" height="150" rx="16" fill="#BDF0EA" stroke="#19C3B5" stroke-width="2"/><text x="1115" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">5. Ranked</text><text x="1115" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">shown for</text><text x="1115" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">relevant searches</text><rect x="64" y="470" width="1152" height="120" rx="16" fill="#FFF6DB" stroke="#E0A100" stroke-width="2"/><text x="640" y="538" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#0A2540" text-anchor="middle">Your job: make every ste