<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Five quick checks: can Google find you?"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7691"/></marker></defs><rect width="1280" height="720" rx="24" fill="#FFFFFF"/><rect x="1" y="1" width="1278" height="718" rx="24" fill="none" stroke="#D5E1EC" stroke-width="2"/><text x="64" y="84" font-family="Sora,Arial,sans-serif" font-size="34" font-weight="700" fill="#0A2540">Five quick checks: can Google find you?</text><rect x="64" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="165.0" y="300" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">1. site: search</text><text x="165.0" y="327" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">are pages listed?</text><line x1="270" y1="305" x2="298" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="302" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="403.0" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">2. Brand search</text><text x="403.0" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">do you rank for</text><text x="403.0" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">your name?</text><line x1="507" y1="305" x2="535" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="539" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="640.0" y="300" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">3. Search Console</text><text x="640.0" y="327" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">Pages report</text><line x1="745" y1="305" x2="773" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="777" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="878.0" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">4. Hidden blocks</text><text x="878.0" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">noindex or</text><text x="878.0" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">robots.txt</text><line x1="982" y1="305" x2="1010" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="1014" y="230" width="202" height="150" rx="16" fill="#BDF0EA" stroke="#19C3B5" stroke-width="2"/><text x="1115.0" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">5. Phone speed</text><text x="1115.0" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">PageSpeed</text><text x="1115.0" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">Insights</text><rect x="64" y="470" width="1152" height="120" rx="16" fill="#FFF6DB" stroke="#E0A100" stroke-width="2"/><text x="640.0" y="538" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#0A2540" text-anchor="middle">Something missing? Fix the cause, then request indexing in Search Console.</text></svg>