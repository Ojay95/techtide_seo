<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="E-E-A-T: four ways to earn trust"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7691"/></marker></defs><rect width="1280" height="720" rx="24" fill="#FFFFFF"/><rect x="1" y="1" width="1278" height="718" rx="24" fill="none" stroke="#D5E1EC" stroke-width="2"/><text x="64" y="84" font-family="Sora,Arial,sans-serif" font-size="34" font-weight="700" fill="#0A2540">E-E-A-T: four ways to earn trust</text><line x1="640" y1="195" x2="640" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><line x1="1040" y1="400" x2="735" y2="400" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><line x1="640" y1="605" x2="640" y2="495" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><line x1="240" y1="400" x2="545" y2="400" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><circle cx="640" cy="400" r="88" fill="#19C3B5"/><text x="640" y="392" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="800" fill="#0A2540" text-anchor="middle">Trust</text><rect x="520" y="157" width="240" height="76" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="640" y="190" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Experience</text><text x="640" y="215" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#0A2540" text-anchor="middle">you have done it</text><rect x="920" y="362" width="240" height="76" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="1040" y="395" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Expertise</text><text x="1040" y="420" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#0A2540" text-anchor="middle">you know it well</text><rect x="520" y="567" width="240" height="76" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="640" y="600" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Authoritativeness</text><text x="640" y="625" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#0A2540" text-anchor="middle">others recognise you</text><rect x="120" y="362" width="240" height="76" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="240" y="395" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Transparency</text><text x="240" y="420" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#0A2540" text-anchor="middle">who, how and why</text><text x="640" y="690" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#5B7691" text-anchor="middle">Trust is the centre. The other three signals help people believe you.</text></svg>