<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="The review loop"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7691"/></marker></defs><rect width="1280" height="720" rx="24" fill="#FFFFFF"/><rect x="1" y="1" width="1278" height="718" rx="24" fill="none" stroke="#D5E1EC" stroke-width="2"/><text x="64" y="84" font-family="Sora,Arial,sans-serif" font-size="34" font-weight="700" fill="#0A2540">The review loop</text><rect x="530" y="130" width="230" height="90" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="645.0" y="170" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#0A2540" text-anchor="middle">1. Job done</text><text x="645.0" y="196" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#0A2540" text-anchor="middle">good experience</text><rect x="920" y="270" width="230" height="90" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="1035.0" y="310" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#0A2540" text-anchor="middle">2. Ask</text><text x="1035.0" y="336" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#0A2540" text-anchor="middle">send the direct link</text><rect x="760" y="500" width="230" height="90" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="875.0" y="540" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#0A2540" text-anchor="middle">3. Customer reviews</text><text x="875.0" y="566" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#0A2540" text-anchor="middle">in their own words</text><rect x="300" y="500" width="230" height="90" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="415.0" y="540" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#0A2540" text-anchor="middle">4. You reply</text><text x="415.0" y="566" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#0A2540" text-anchor="middle">to every review</text><rect x="140" y="270" width="230" height="90" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="255.0" y="310" font-family="DM Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#0A2540" text-anchor="middle">5. New customers</text><text x="255.0" y="336" font-family="DM Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#0A2540" text-anchor="middle">read and choose you</text><line x1="765" y1="175" x2="915" y2="290" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><line x1="1030" y1="362" x2="900" y2="498" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><line x1="755" y1="548" x2="535" y2="548" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><line x1="330" y1="498" x2="270" y2="364" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><line x1="262" y1="272" x2="528" y2="180" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><text x="640" y="420" font-family="DM Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#0A7A72" text-anchor="middle">Repeat on every job</text></svg>