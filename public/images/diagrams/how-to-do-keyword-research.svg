<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="From topics to a keyword map"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7691"/></marker></defs><rect width="1280" height="720" rx="24" fill="#FFFFFF"/><rect x="1" y="1" width="1278" height="718" rx="24" fill="none" stroke="#D5E1EC" stroke-width="2"/><text x="64" y="84" font-family="Sora,Arial,sans-serif" font-size="34" font-weight="700" fill="#0A2540">From topics to a keyword map</text><rect x="64" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="165.0" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">1. Topics</text><text x="165.0" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">your services</text><text x="165.0" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">and problems</text><line x1="270" y1="305" x2="298" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="302" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="403.0" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">2. Seeds</text><text x="403.0" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">autocomplete,</text><text x="403.0" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">People also ask</text><line x1="507" y1="305" x2="535" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="539" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="640.0" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">3. Intent</text><text x="640.0" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">learn, compare,</text><text x="640.0" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">buy</text><line x1="745" y1="305" x2="773" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="777" y="230" width="202" height="150" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="878.0" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">4. Score</text><text x="878.0" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">volume, difficulty,</text><text x="878.0" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">value</text><line x1="982" y1="305" x2="1010" y2="305" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="1014" y="230" width="202" height="150" rx="16" fill="#BDF0EA" stroke="#19C3B5" stroke-width="2"/><text x="1115.0" y="286" font-family="DM Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">5. Map</text><text x="1115.0" y="314" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">one main keyword</text><text x="1115.0" y="341" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#0A2540" text-anchor="middle">per page</text><rect x="64" y="470" width="1152" height="120" rx="16" fill="#FFF6DB" stroke="#E0A100" stroke-width="2"/><text x="640.0" y="538" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#0A2540" text-anchor="middle">Choose terms your customers actually use, then give every page one main target.</text></svg>