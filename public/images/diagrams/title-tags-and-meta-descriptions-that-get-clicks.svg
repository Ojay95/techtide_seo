<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Anatomy of a search result"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7691"/></marker></defs><rect width="1280" height="720" rx="24" fill="#FFFFFF"/><rect x="1" y="1" width="1278" height="718" rx="24" fill="none" stroke="#D5E1EC" stroke-width="2"/><text x="64" y="84" font-family="Sora,Arial,sans-serif" font-size="34" font-weight="700" fill="#0A2540">Anatomy of a search result</text><rect x="64" y="130" width="760" height="260" rx="18" fill="#FFFFFF" stroke="#9FB3C8" stroke-width="2"/><text x="96" y="178" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B7A4B" text-anchor="start">techtideseo.com › guides › what-is-seo</text><text x="96" y="232" font-family="DM Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#1A55C8" text-anchor="start">What Is SEO and How Does It Work? | TechTide SEO</text><text x="96" y="282" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#4A5A6B" text-anchor="start">SEO is the work of making your website easier for search engines to find</text><text x="96" y="312" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#4A5A6B" text-anchor="start">and more useful to people. Learn the five parts and where to start.</text><line x1="824" y1="166" x2="880" y2="166" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="888" y="128" width="328" height="76" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="1052" y="161" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">URL</text><text x="1052" y="186" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#0A2540" text-anchor="middle">Short, readable, with the topic in it</text><line x1="824" y1="226" x2="880" y2="226" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="888" y="188" width="328" height="76" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="1052" y="221" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Title tag</text><text x="1052" y="246" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#0A2540" text-anchor="middle">About 30 to 60 characters, main keyword near the front</text><line x1="824" y1="291" x2="880" y2="291" stroke="#5B7691" stroke-width="3" marker-end="url(#a)"/><rect x="888" y="253" width="328" height="76" rx="16" fill="#EAF2F8" stroke="#9FB3C8" stroke-width="2"/><text x="1052" y="286" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A2540" text-anchor="middle">Meta description</text><text x="1052" y="311" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#0A2540" text-anchor="middle">About 150 characters: a clear benefit and next step</text><rect x="64" y="440" width="1152" height="150" rx="16" fill="#FFF6DB" stroke="#E0A100" stroke-width="2"/><text x="640" y="509" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#0A2540" text-anchor="middle">Write for people first</text><text x="640" y="539" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#0A2540" text-anchor="middle">A good title tells searchers what they will get. A good description gives them a reason to click.</text></svg>