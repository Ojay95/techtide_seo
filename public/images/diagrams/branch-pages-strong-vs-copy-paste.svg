<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Branch pages: strong or copy-paste?"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B7691"/></marker></defs><rect width="1280" height="720" rx="24" fill="#FFFFFF"/><rect x="1" y="1" width="1278" height="718" rx="24" fill="none" stroke="#D5E1EC" stroke-width="2"/><text x="64" y="84" font-family="Sora,Arial,sans-serif" font-size="34" font-weight="700" fill="#0A2540">Branch pages: strong or copy-paste?</text><rect x="64" y="130" width="560" height="500" rx="20" fill="#F4F8FB" stroke="#9FB3C8" stroke-width="2"/><rect x="64" y="130" width="560" height="70" rx="20" fill="#2EB67D"/><text x="344" y="176" font-family="DM Sans,Arial,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Strong branch page</text><circle cx="108" cy="262" r="15" fill="#2EB67D"/><text x="108" y="270" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text><text x="138" y="270" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">Its own address, phone and hours</text><circle cx="108" cy="338" r="15" fill="#2EB67D"/><text x="108" y="346" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text><text x="138" y="346" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">Photos of that branch and its team</text><circle cx="108" cy="414" r="15" fill="#2EB67D"/><text x="108" y="422" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text><text x="138" y="422" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">Reviews from that branch</text><circle cx="108" cy="490" r="15" fill="#2EB67D"/><text x="108" y="498" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text><text x="138" y="498" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">Directions and nearby landmarks</text><circle cx="108" cy="566" r="15" fill="#2EB67D"/><text x="108" y="574" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text><text x="138" y="574" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">Services offered at that branch</text><rect x="656" y="130" width="560" height="500" rx="20" fill="#F4F8FB" stroke="#9FB3C8" stroke-width="2"/><rect x="656" y="130" width="560" height="70" rx="20" fill="#E5534B"/><text x="936" y="176" font-family="DM Sans,Arial,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Copy-paste page</text><circle cx="700" cy="262" r="15" fill="#E5534B"/><text x="700" y="270" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✕</text><text x="730" y="270" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">Same text with only the city swapped</text><circle cx="700" cy="338" r="15" fill="#E5534B"/><text x="700" y="346" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✕</text><text x="730" y="346" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">Stock photos</text><circle cx="700" cy="414" r="15" fill="#E5534B"/><text x="700" y="422" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✕</text><text x="730" y="422" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">One phone number for every branch</text><circle cx="700" cy="490" r="15" fill="#E5534B"/><text x="700" y="498" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✕</text><text x="730" y="498" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">No directions</text><circle cx="700" cy="566" r="15" fill="#E5534B"/><text x="700" y="574" font-family="DM Sans,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">✕</text><text x="730" y="574" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#0A2540" text-anchor="start">Only a store locator, no real page</text><text x="640" y="680" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#5B7691" text-anchor="middle">Google and customers can tell when a page was made for a place, and when it was not.</text></svg>